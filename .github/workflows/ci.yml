name: ci

# Pull requests only. Running on push as well means a develop -> master PR fires twice
# on the same commit, since its head commit is also the develop tip.
on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    # prisma.config.ts resolves DATABASE_URL eagerly, so every Prisma command
    # needs one even when it never opens a connection. Nothing in this job talks
    # to a database, so a placeholder is enough.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # prisma generate was removed from postinstall, so the generated client
      # must be built explicitly before anything that imports it typechecks.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm run typecheck

      # The release gate. Feature branches merge into develop many times a day and only
      # need the lint and typecheck above; the suite runs once on the develop -> master
      # pull request, where a regression would otherwise reach production. `base_ref` is
      # set on pull_request only.
      - name: Unit tests
        if: github.base_ref == 'master'
        run: pnpm run test:unit

      # Also the release gate, and only there. Feature PRs into develop get their
      # production build check from the Vercel preview deployment; this build also
      # gives Lighthouse something to audit, so the two run together or not at all.
      - name: Build
        if: github.base_ref == 'master'
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NUXT_CLERK_SECRET_KEY: ${{ secrets.NUXT_CLERK_SECRET_KEY }}

      # lighthouserc.cjs starts the Nitro server it just built and audits the landing page.
      # The keys are passed again because this is a new process: the Clerk module reads them
      # at runtime, not only during the build.
      - name: Lighthouse CI
        if: github.base_ref == 'master'
        run: pnpm exec lhci autorun
        env:
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NUXT_CLERK_SECRET_KEY: ${{ secrets.NUXT_CLERK_SECRET_KEY }}
